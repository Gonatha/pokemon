<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon Classeur Pokémon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : un classeur — séries/extensions à gauche, pochettes de cartes à droite */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fb; --line:#d9dfea;
  --fg:#18203a; --muted:#5d6886; --accent:#e3350d; --accent-ink:#ffffff;
  --gold:#d9a400; --ok:#1d9a5b; --slot:#e3e8f1;
  --shadow:0 1px 2px rgba(24,32,58,.08),0 4px 14px rgba(24,32,58,.06);
  --f-display:"Rubik",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1424; --surface:#171d31; --surface-2:#1d2440; --line:#2b3456;
  --fg:#e8ecf7; --muted:#97a2c3; --accent:#ff5a36; --accent-ink:#ffffff;
  --gold:#f2c230; --ok:#3cc982; --slot:#212945;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1424; --surface:#171d31; --surface-2:#1d2440; --line:#2b3456;
  --fg:#e8ecf7; --muted:#97a2c3; --accent:#ff5a36; --accent-ink:#ffffff;
  --gold:#f2c230; --ok:#3cc982; --slot:#212945;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none!important}

/* ---------- En-tête ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:800 20px/1 var(--f-display);letter-spacing:-.01em}
.ball{width:26px;height:26px;border-radius:50%;border:3px solid var(--fg);position:relative;overflow:hidden;flex:none;
  background:linear-gradient(var(--accent) 0 45%,var(--fg) 45% 55%,var(--surface) 55%)}
.ball::after{content:"";position:absolute;inset:50% auto auto 50%;width:9px;height:9px;transform:translate(-50%,-50%);
  border-radius:50%;background:var(--surface);border:2.5px solid var(--fg)}
.gstats{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
.gstats .btn{align-self:center}
.gstat{display:flex;flex-direction:column;line-height:1.15}
.gstat b{font:700 16px var(--f-mono);font-variant-numeric:tabular-nums}
.gstat span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.55;cursor:default}
select.btn{padding-right:8px}
.menu-btn{display:none}

/* ---------- Mise en page ---------- */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100% - 60px)}
aside.side{border-right:1px solid var(--line);background:var(--surface);position:sticky;top:57px;
  height:calc(100vh - 57px);overflow-y:auto;padding:12px 10px 40px}
.side-search{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);margin-bottom:10px}
.serie{margin-bottom:4px}
.serie>button{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;padding:8px 6px;border-radius:8px;
  font:700 13px var(--f-display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left}
.serie>button:hover{background:var(--surface-2)}
.serie>button .chev{margin-left:auto;transition:transform .15s}
.serie.open>button .chev{transform:rotate(90deg)}
.serie .sets{display:none;padding-left:2px}
.serie.open .sets{display:block}
.setlink{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;
  background:none;border:0;border-radius:8px;padding:6px}
.setlink:hover{background:var(--surface-2)}
.setlink.active{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--accent)}
.setlink img{width:48px;height:26px;object-fit:contain}
.setlink .nm{font-weight:600;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setlink .meta{font:500 11px var(--f-mono);color:var(--muted);display:flex;align-items:center;gap:6px}
.bar{height:4px;border-radius:2px;background:var(--slot);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.done i{background:var(--gold)}

main{padding:20px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left));min-width:0}

/* ---------- Bandeau d'extension ---------- */
.sethead{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.sethead img.logo{height:64px;max-width:180px;object-fit:contain}
.sethead h1{margin:0;font:800 26px/1.1 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.sethead .sub{color:var(--muted);font-size:13px}
.kpis{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
.kpi b{display:block;font:700 22px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bigbar{flex-basis:100%;height:8px;border-radius:4px;background:var(--slot);overflow:hidden}
.bigbar i{display:block;height:100%;background:var(--ok);transition:width .3s}

.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.filters input[type=search]{flex:1;min-width:160px;max-width:280px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.progress-note{font-size:12px;color:var(--muted)}

/* ---------- Grille de cartes ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;
  transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.pic{position:relative;aspect-ratio:63/88;border-radius:7px;background:var(--slot);overflow:hidden;border:0;padding:0;width:100%;max-width:100%;
  transform:perspective(680px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;
  transition:transform .35s cubic-bezier(.2,.75,.25,1),box-shadow .35s}
.pic.tilting{transition:transform .07s linear;box-shadow:0 10px 24px rgba(24,32,58,.28);will-change:transform;z-index:1}
.pic img{position:relative;width:100%;height:100%;object-fit:cover;display:block;transition:filter .25s,opacity .25s}
/* Carte manquante : couleurs atténuées (et non plus grisée), pleine couleur au survol */
.card:not(.owned) .pic img,.card:not(.owned) .pic .noimg{filter:saturate(.3) contrast(.92);opacity:.6}
.card:not(.owned):hover .pic img,.card:not(.owned):hover .pic .noimg{filter:none;opacity:1}
/* Carte possédée : bien visible dans le classeur */
.card.owned{border-color:color-mix(in srgb,var(--ok) 55%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--ok) 25%,transparent)}
.card.owned .pic{box-shadow:0 2px 6px rgba(0,0,0,.22)}
/* Petit effet quand on coche « Je l'ai » */
.card.just-owned{animation:ownpop .5s cubic-bezier(.2,.75,.25,1.4)}
@keyframes ownpop{0%,100%{transform:scale(1)}40%{transform:scale(1.05)}}
.card.just-owned .pic::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.8) 50%,transparent 70%);transform:translateX(-110%);animation:shine .8s .1s ease-out forwards}
@keyframes shine{to{transform:translateX(110%)}}
.lang-badge{position:absolute;top:6px;left:6px;background:rgba(18,26,74,.85);color:#fff;border-radius:5px;padding:0 5px;font:700 10px/1.6 var(--f-mono);letter-spacing:.04em}
.en-tag{font:700 9px/1 var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 3px;margin-left:4px;vertical-align:1px}
/* Reflet + voile holographique révélés au survol (pointeur fin uniquement) */
.pic .glare,.pic .sheen{position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:0;transition:opacity .35s}
.pic .glare{background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.55),rgba(255,255,255,0) 55%);mix-blend-mode:soft-light;opacity:var(--holo,0)}
.pic .sheen{background:repeating-linear-gradient(112deg,rgba(255,0,132,.5),rgba(255,176,0,.5) 14%,rgba(68,255,110,.5) 28%,rgba(0,198,255,.5) 42%,rgba(150,60,255,.5) 56%,rgba(255,0,132,.5) 70%);
  background-size:280% 280%;background-position:var(--mx,50%) var(--my,50%);mix-blend-mode:color-dodge;opacity:calc(var(--holo,0)*.38)}
/* Carte de remplacement quand l'image n'existe pas (encore) dans la base */
.noimg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px;text-align:center;
  border-radius:inherit;color:#fff;background:radial-gradient(130% 90% at 50% 0%,#3b5ee0 0%,#1f2f86 55%,#121a4a 100%);
  box-shadow:inset 0 0 0 5px #f2c230,inset 0 0 0 8px #121a4a;transition:filter .25s,opacity .25s}
.ph-ball{width:40%;aspect-ratio:1;border-radius:50%;position:relative;margin-bottom:6px;
  background:linear-gradient(#e3350d 0 44%,#121a4a 44% 56%,#f4f6ff 56%);box-shadow:0 0 0 3px #121a4a,0 0 0 5px rgba(255,255,255,.55)}
.ph-ball::after{content:"";position:absolute;inset:34%;border-radius:50%;background:#f4f6ff;box-shadow:0 0 0 3px #121a4a}
.ph-name{font:700 13px/1.2 var(--f-display);text-wrap:balance}
.ph-num{font:500 11px var(--f-mono);opacity:.8}
.ph-note{font-size:10px;opacity:.65;line-height:1.3}
.pic:has(img) .noimg,.holo-card:has(img) .noimg{display:none}
.badge-owned{position:absolute;top:6px;right:6px;background:var(--ok);color:#fff;border-radius:50%;width:24px;height:24px;
  display:grid;place-items:center;font-weight:700;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.card:not(.owned) .badge-owned{display:none}
.tags{position:absolute;left:6px;bottom:6px;display:flex;gap:4px;flex-wrap:wrap}
.tag{background:var(--fg);color:var(--bg);border-radius:6px;padding:1px 6px;font:700 11px/1.5 var(--f-mono)}
.tag.trade{background:var(--gold);color:#1a1300}
.mine{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;display:grid;gap:10px}
.mine-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mine-row>span{font-weight:600}
.mine-row small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:none;width:34px;height:32px;font-size:18px;font-weight:600}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{min-width:30px;text-align:center;font:700 14px var(--f-mono)}
.mine select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.tradegroup h2{font:800 18px var(--f-display);margin:22px 0 10px}
.tradecard .cond{font-size:11px;color:var(--muted)}
.cinfo{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.cname{font-weight:600;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cnum{font:500 11px var(--f-mono);color:var(--muted);white-space:nowrap}
.crow{display:flex;justify-content:space-between;align-items:center;gap:6px}
.price{font:700 13px var(--f-mono);font-variant-numeric:tabular-nums}
.price.none{color:var(--muted);font-weight:500}
.price.hot{color:var(--accent)}
.price button{border:0;background:none;padding:0;color:var(--muted);font:500 12px var(--f-body);text-decoration:underline}
.own{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;cursor:pointer;user-select:none;
  border:1px solid var(--line);border-radius:999px;padding:3px 9px 3px 6px;background:var(--surface-2)}
.own input{accent-color:var(--ok);margin:0;width:15px;height:15px;cursor:pointer}
.card.owned .own{border-color:var(--ok);color:var(--ok)}

.empty,.welcome{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--muted)}
.welcome h2{font:800 22px var(--f-display);color:var(--fg);margin:0 0 6px}
.loader{display:flex;align-items:center;gap:10px;color:var(--muted);padding:30px;justify-content:center}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.error{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin:10px 0}

/* ---------- Fiche carte ---------- */
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--fg);max-width:min(860px,calc(100vw - 32px));width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,14,28,.65)}
.dlg{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;padding:20px}
.dlg img{width:100%;border-radius:12px;display:block}
.dlg h2{margin:0;font:800 24px/1.15 var(--f-display)}
.dlg .sub{color:var(--muted);margin-bottom:12px}
.ptable{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 14px}
.ptable th{text-align:left;font-weight:500;color:var(--muted);padding:5px 0;border-bottom:1px solid var(--line)}
.ptable td{text-align:right;font:600 13px var(--f-mono);font-variant-numeric:tabular-nums;padding:5px 0;border-bottom:1px solid var(--line)}
.dlg h3{font:700 12px var(--f-display);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 2px}
.close{position:absolute;top:10px;right:10px;border:0;background:var(--surface-2);border-radius:50%;width:34px;height:34px;font-size:18px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.links a{color:var(--accent);font-weight:600}
.updated{font-size:11px;color:var(--muted)}

/* ---------- Grande carte interactive (fiche) ---------- */
dialog[open]{animation:dlgpop .28s cubic-bezier(.2,.75,.25,1)}
@keyframes dlgpop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.holo{perspective:1100px;width:100%}
.holo-card{position:relative;border-radius:12px;overflow:hidden;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));transform-style:preserve-3d;
  transition:transform .4s cubic-bezier(.2,.75,.25,1),box-shadow .4s;box-shadow:0 16px 42px rgba(0,0,0,.4)}
.holo-card.tilting{transition:transform .07s linear;box-shadow:0 26px 60px rgba(0,0,0,.5);will-change:transform}
.holo-card img{display:block;width:100%;border-radius:inherit}
.holo-card .glare,.holo-card .sheen{position:absolute;inset:0;pointer-events:none;border-radius:inherit;transition:opacity .4s}
.holo-card .glare{background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.7),rgba(255,255,255,0) 55%);mix-blend-mode:soft-light;opacity:var(--holo,0)}
.holo-card .sheen{background:repeating-linear-gradient(112deg,rgba(255,0,132,.55),rgba(255,176,0,.55) 13%,rgba(68,255,110,.55) 26%,rgba(0,198,255,.55) 39%,rgba(150,60,255,.55) 52%,rgba(255,0,132,.55) 65%);
  background-size:280% 280%;background-position:var(--mx,50%) var(--my,50%);mix-blend-mode:color-dodge;opacity:calc(var(--holo,0)*.45)}
.holo-card:not(:has(img)){aspect-ratio:63/88}
.holo-card .noimg .ph-name{font-size:20px}
.holo-card .noimg .ph-num{font-size:13px}
.holo-card .noimg .ph-note{font-size:12px}
.holo-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:16px}
/* Sur écran tactile : scintillement doux automatique, et la carte penche quand on glisse le doigt dessus */
@media (hover:none){
  .holo{touch-action:none}
  .holo-card .sheen{opacity:.28;animation:holoshift 7s ease-in-out infinite}
  .holo-card.tilting .sheen{animation:none;opacity:.5}
}
@keyframes holoshift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:9px 16px;border-radius:9px;font-weight:500;z-index:50;box-shadow:var(--shadow)}

@media (max-width:860px){
  header.top{position:static}
  .menu-btn{display:inline-block}
  .app{grid-template-columns:minmax(0,1fr)}
  aside.side{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);height:auto;z-index:40;transform:translateX(-102%);
    transition:transform .2s;box-shadow:var(--shadow);padding-top:calc(12px + env(safe-area-inset-top))}
  body.drawer aside.side{transform:none}
  body.drawer::after{content:"";position:fixed;inset:0;background:rgba(10,14,28,.5);z-index:35}
  /* En-tête compact : logo + menu, puis les totaux, puis les réglages sur une ligne qui défile */
  header.top{gap:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:8px}
  .menu-btn{padding:5px 10px}
  .brand{font-size:17px;gap:8px}
  .brand .ball{width:22px;height:22px}
  .gstats{order:2;margin-left:0;width:100%;gap:8px 14px;align-items:center}
  .gstat b{font-size:14px}
  .gstat span{font-size:10px;letter-spacing:.03em;white-space:nowrap}
  #tradeBtn{margin-left:auto}
  .tools{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .tools::-webkit-scrollbar{display:none}
  .tools .btn{padding:5px 10px;font-size:13px;flex:none}
  main{padding-top:12px}
  .sethead{padding:12px 14px;gap:8px 14px;border-radius:12px}
  .sethead img.logo{height:38px;max-width:110px}
  .sethead h1{font-size:20px}
  .sethead .sub{font-size:12px}
  .kpis{margin-left:0;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .kpi b{font-size:15px}
  .kpi span{font-size:9.5px;line-height:1.25;display:block}
  .filters{gap:8px;margin:12px 0}
  .seg{width:100%;overflow-x:auto;scrollbar-width:none}
  .seg button{flex:1 0 auto;padding:6px 10px}
  .filters input[type=search]{max-width:none;flex:1 1 0;min-width:0}
  .filters .btn{padding:6px 10px;font-size:13px}
  .filters #sort{flex:none;max-width:46%}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .card{padding:6px;gap:6px}
  .dlg{grid-template-columns:minmax(0,1fr);padding:16px}
  .dlg img{max-width:300px;margin:0 auto}
  .dlg .holo{max-width:300px;margin:0 auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="btn menu-btn" id="menuBtn" aria-label="Afficher les extensions">☰ Extensions</button>
  <div class="brand"><span class="ball" aria-hidden="true"></span>Mon Classeur Pokémon</div>
  <div class="gstats">
    <div class="gstat"><b id="gOwned">0</b><span>cartes possédées</span></div>
    <div class="gstat"><b id="gValue">—</b><span id="gCover">valeur estimée</span></div>
    <button class="btn" id="gCalc" hidden>Calculer la valeur</button>

      <option value="fr">Français</option><option value="en">English</option>

<div class="app">

  </aside>
  <main id="main">
    <div class="welcome">
      <h2>Choisis une extension</h2>

    </div>

</div>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ================= Données & stockage ================= */
const API = "https://api.tcgdex.net/v2";
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ console.warn("stockage plein", e); } }
};
const DAY = 86400000;
let lang = LS.get("pk.lang", "fr");
let owned = LS.get("pk.owned", {});          // { cardId: true }
let prices = LS.get("pk.prices", {});        // { cardId: {t, cm:{...}, tp:{...}} }
let ownedMeta = LS.get("pk.ownedMeta", {});
let custom = LS.get("pk.custom", {});
let items = LS.get("pk.items", {});           // { cardId: {q: quantité, c: état, t: nb à échanger} }
let view = "set";                             // "set" ou "trades"
const CONDS = [["","Non précisé"],["MT","Mint · parfait"],["NM","Near Mint · quasi neuf"],["EX","Excellent"],["GD","Good · bon"],["LP","Light Played · peu jouée"],["PL","Played · jouée"],["PO","Poor · abîmée"]];
const CONDS_SHORT = {MT:"Mint",NM:"Near Mint",EX:"Excellent",GD:"Good",LP:"Light Played",PL:"Played",PO:"Poor"};
const qty = id => owned[id] ? Math.max(1, items[id]?.q || 1) : 0;
const tradeN = id => owned[id] ? Math.min(items[id]?.t || 0, qty(id)) : 0;
function setItem(id, patch){
  const it = {q:1, c:"", t:0, ...(items[id] || {}), ...patch};
  it.q = Math.max(1, Math.min(999, it.q|0)); it.t = Math.max(0, Math.min(it.q, it.t|0));
  items[id] = it; LS.set("pk.items", items);
}
function metaFrom(c, set){ return {name:c.name, set:set.name, setId:set.id, n:c.localId, img:c.image || null}; }
function idSet(id){ const i = id.lastIndexOf("-"); return i > 0 ? id.slice(0, i) : id; }         // { cardId: prix perso en € }
let priceMode = LS.get("pk.priceMode", "avg30");  // { cardId: {name, set} } pour l'export lisible
let seriesData = [];                          // [{id,name,logo,sets:[...]}]
let current = null;                           // extension affichée
let filter = "all", query = "", sortBy = "num";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtEur = v => v == null || isNaN(v) ? "—" : v.toLocaleString("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:2});
const fmtUsd = v => v == null || isNaN(v) ? "—" : v.toLocaleString("fr-FR",{style:"currency",currency:"USD",minimumFractionDigits:2});
const T = (fr, en) => lang === "fr" ? fr : en;

async function getJSON(path, cacheKey, maxAge){
  if(cacheKey){
    const c = LS.get(cacheKey);
    if(c && Date.now() - c.t < maxAge) return c.d;
  }
  const r = await fetch(API + path);
  if(!r.ok) throw new Error("HTTP " + r.status + " sur " + path);
  const d = await r.json();
  if(cacheKey) LS.set(cacheKey, {t:Date.now(), d});
  return d;
}

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2200);
}

/* ================= Prix ================= */
function compactPricing(p){
  if(!p) return null;
  const out = {};
  const cm = p.cardmarket;
  if(cm){
    out.cm = {u:cm.updated, id:cm.idProduct,
      trend:cm.trend, avg:cm.avg, low:cm.low, avg7:cm.avg7, avg30:cm.avg30,
      trendH:cm["trend-holo"], avgH:cm["avg-holo"], lowH:cm["low-holo"], avg30H:cm["avg30-holo"]};
  }
  const tp = p.tcgplayer;
  if(tp){
    out.tp = {u:tp.updated, v:{}};
    for(const k of Object.keys(tp)){
      const x = tp[k];
      if(x && typeof x === "object" && ("marketPrice" in x || "midPrice" in x))
        out.tp.v[k] = {m:x.marketPrice, lo:x.lowPrice, mid:x.midPrice, hi:x.highPrice};
    }
  }
  return out;
}
// Prix de référence : tendance Cardmarket (€), sinon moyenne, sinon variante holo
// Prix de référence selon le réglage choisi (le prix perso passe toujours en premier)
function refPrice(id){
  if(typeof custom[id] === "number") return custom[id];
  const p = prices[id]; if(!p || !p.cm) return null;
  const c = p.cm;
  const order = priceMode === "low" ? [c.low, c.lowH, c.avg30, c.avg, c.trend]
    : priceMode === "trend" ? [c.trend, c.avg, c.avg30, c.trendH, c.avgH]
    : [c.avg30, c.avg7, c.avg, c.trend, c.avg30H, c.trendH];
  const v = order.find(x => typeof x === "number" && x > 0);
  return v ?? null;
}
const MODE_LABEL = {avg30:"Moyenne 30 jours Cardmarket", trend:"Tendance Cardmarket", low:"Prix le plus bas Cardmarket"};
const PV = 2; // version du cache de prix
function priceFresh(id){ const c = prices[id]; return c && c.v === PV && Date.now() - c.t < DAY; }
async function priceFromCard(card, id){
  let p = compactPricing(card.pricing) || {};
  // Les vieilles cartes n'ont parfois un prix que dans la version anglaise de la base
  if(!p.cm && lang !== "en"){
    try{
      const en = await getJSON(`/en/cards/${encodeURIComponent(id)}`);
      const pe = compactPricing(en.pricing) || {};
      if(pe.cm) p.cm = pe.cm;
      if(!p.tp && pe.tp) p.tp = pe.tp;
    }catch(e){}
  }
  prices[id] = {v:PV, t:Date.now(), ...p, r:card.rarity || null};
  savePricesSoon();
  return prices[id];
}
// Fiche d'une carte dans la langue choisie, sinon en anglais (cartes absentes de la base française)
async function getCard(id){
  try{ return await getJSON(`/${lang}/cards/${encodeURIComponent(id)}`); }
  catch(e){ if(lang === "en") throw e; return getJSON(`/en/cards/${encodeURIComponent(id)}`); }
}
async function fetchPrice(id, force){
  if(!force && priceFresh(id)) return prices[id];
  const card = await getCard(id);
  return priceFromCard(card, id);
}
// File d'attente : charge les prix de plusieurs cartes, 6 à la fois
async function priceQueue(ids, force, onEach){
  let i = 0, done = 0, fail = 0;
  const worker = async () => {
    while(i < ids.length){
      const id = ids[i++];
      try{ await fetchPrice(id, force); }catch(e){ fail++; }
      done++; onEach && onEach(id, done);
    }
  };
  await Promise.all(Array.from({length:6}, worker));
  LS.set("pk.prices", prices);
  return {done, fail};
}
let _ps; function savePricesSoon(){ clearTimeout(_ps); _ps = setTimeout(() => LS.set("pk.prices", prices), 400); }

/* ================= Barre latérale ================= */
// Séries d'une langue, dans l'ordre chronologique (TCG Pocket exclu)
async function seriesFor(l){
  const list = await getJSON(`/${l}/series`, `pk.series.${l}`, 3*DAY);
  const details = await Promise.all(list.filter(s => s.id !== "tcgp").map(s =>
    getJSON(`/${l}/series/${encodeURIComponent(s.id)}`, `pk.serie.${l}.${s.id}`, 3*DAY).catch(() => null)));
  return details.filter(Boolean).filter(s => s.sets && s.sets.length);
}
// Ajoute à `base` les éléments de `extra` qu'il n'a pas, chacun placé juste après son voisin dans `extra`
function mergeOrdered(base, extra, mark, skip){
  const out = base.slice(), have = new Set([...base.map(x => x.id), ...(skip || [])]);
  extra.forEach((x, i) => {
    if(have.has(x.id)) return;
    let at = 0;
    for(let k = i - 1; k >= 0; k--){ const j = out.findIndex(o => o.id === extra[k].id); if(j >= 0){ at = j + 1; break; } }
    out.splice(at, 0, mark(x)); have.add(x.id);
  });
  return out;
}
async function loadSeries(){
  const box = $("#series");
  const askedLang = lang;
  try{
    const mine = await seriesFor(lang);
    seriesData = mine.slice().reverse();
    renderSide();
    route();
    if(lang === "en") return;
    // La base française est incomplète : on ajoute les extensions qui n'existent qu'en anglais
    const en = await seriesFor("en").catch(() => null);
    if(!en || lang !== askedLang) return;
    const known = new Set(mine.flatMap(s => s.sets.map(x => x.id)));
    const enById = Object.fromEntries(en.map(s => [s.id, s]));
    const markSet = x => ({...x, en:true});
    let merged = mine.map(s => enById[s.id] ? {...s, sets:mergeOrdered(s.sets, enById[s.id].sets, markSet, known)} : s);
    merged = mergeOrdered(merged, en, s => ({...s, sets:s.sets.filter(x => !known.has(x.id)).map(markSet)}));
    seriesData = merged.filter(s => s.sets.length).reverse();
    renderSide();
  }catch(e){
    box.innerHTML = `<div class="error">Impossible de charger les collections (${esc(e.message)}).<br>Vérifie ta connexion internet puis recharge la page.</div>`;
  }
}

function setProgress(set){
  const total = set.cardCount?.total || 0;
  const ids = LS.get(`pk.setids.${set.id}`);
  const n = ids ? ids.filter(id => owned[id]).length : Object.keys(owned).filter(id => id.startsWith(set.id + "-")).length;
  return {n, total};
}

function renderSide(){
  const q = $("#setSearch").value.trim().toLowerCase();
  const box = $("#series");
  const openIds = LS.get("pk.openSeries", null);
  let html = "";
  seriesData.forEach((s, i) => {
    const sets = s.sets.slice().reverse().filter(st => !q || st.name.toLowerCase().includes(q) || st.id.toLowerCase().includes(q));
    if(!sets.length) return;
    const isOpen = q || (openIds ? openIds.includes(s.id) : i === 0) || (current && s.sets.some(x => x.id === current.id));
    html += `<div class="serie${isOpen ? " open" : ""}" data-serie="${esc(s.id)}">
      <button type="button" class="serie-toggle">${esc(s.name)}<span class="chev">›</span></button><div class="sets">`;
    for(const st of sets){
      const {n, total} = setProgress(st);
      const pct = total ? Math.min(100, n / total * 100) : 0;
      html += `<button type="button" class="setlink${current && current.id === st.id ? " active" : ""}" data-set="${esc(st.id)}">
        ${st.logo ? `<img src="${esc(st.logo)}.webp" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<span></span>`}
        <span style="min-width:0"><div class="nm" ${st.en ? `title="Extension absente de la base française : affichée en anglais"` : ""}>${esc(st.name)}${st.en ? `<span class="en-tag">EN</span>` : ""}</div>
        <div class="meta"><span>${n}/${total}</span><span class="bar${total && n >= total ? " done" : ""}"><i style="width:${pct}%"></i></span></div></span>
      </button>`;
    }
    html += `</div></div>`;
  });
  box.innerHTML = html || `<div class="empty">Aucune extension trouvée.</div>`;
}

$("#series").addEventListener("click", e => {
  const tg = e.target.closest(".serie-toggle");
  if(tg){
    const el = tg.parentElement; el.classList.toggle("open");
    LS.set("pk.openSeries", [...document.querySelectorAll(".serie.open")].map(x => x.dataset.serie));
    return;
  }
  const sl = e.target.closest(".setlink");
  if(sl){ location.hash = "set-" + sl.dataset.set; document.body.classList.remove("drawer"); }
});
$("#setSearch").addEventListener("input", renderSide);
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(h === "echanges") renderTrades();
  else if(h.startsWith("set-")) openSet(h.slice(4));
}
window.addEventListener("hashchange", route);
$("#tradeBtn").addEventListener("click", () => { if(location.hash === "#echanges") renderTrades(); else location.hash = "echanges"; });
$("#menuBtn").addEventListener("click", () => document.body.classList.toggle("drawer"));
document.addEventListener("click", e => {
  if(document.body.classList.contains("drawer") && !e.target.closest("#side") && !e.target.closest("#menuBtn")) document.body.classList.remove("drawer");
});

/* ================= Extension ================= */
async function openSet(id){
  const main = $("#main");
  main.innerHTML = `<div class="loader"><span class="spin"></span>Chargement de l'extension…</div>`;
  try{
    let set = null;
    try{ set = await getJSON(`/${lang}/sets/${encodeURIComponent(id)}`, `pk.set.${lang}.${id}`, 2*DAY); }
    catch(e){ if(lang === "en") throw e; }
    // La base française est incomplète : on complète avec l'anglais (cartes absentes, images manquantes,
    // voire extension entière absente)
    if(lang !== "en"){
      let en = null;
      try{ en = await getJSON(`/en/sets/${encodeURIComponent(id)}`, `pk.set.en.${id}`, 2*DAY); }
      catch(e){ if(!set) throw e; }
      if(!set) set = {...en, cards:en.cards.map(c => ({...c, en:true}))};
      else if(en){
        const m = Object.fromEntries(en.cards.map(c => [c.id, c]));
        set.cards.forEach(c => { if(!c.image && m[c.id]?.image) c.image = m[c.id].image; });
        const have = new Set(set.cards.map(c => c.id));
        const extra = en.cards.filter(c => !have.has(c.id)).map(c => ({...c, en:true}));
        if(extra.length) set.cards = set.cards.concat(extra);
        if((en.cardCount?.total || 0) > (set.cardCount?.total || 0)) set.cardCount = en.cardCount;
      }
    }
    LS.set(`pk.setids.${set.id}`, set.cards.map(c => c.id));
    current = set; view = "set";
    let metaChanged = false;
    set.cards.forEach(c => { if(owned[c.id] && (!ownedMeta[c.id] || !ownedMeta[c.id].setId)){ ownedMeta[c.id] = metaFrom(c, set); metaChanged = true; } });
    if(metaChanged) LS.set("pk.ownedMeta", ownedMeta);
    renderSet();
    renderSide();
    window.scrollTo({top:0});
    autoPriceOwned(set);
  }catch(e){
    main.innerHTML = `<div class="error">Impossible de charger cette extension (${esc(e.message)}).</div>`;
  }
}

function setStats(){
  const cards = current.cards;
  let n = 0, vOwned = 0, vMissing = 0, priced = 0;
  for(const c of cards){
    const p = refPrice(c.id);
    if(prices[c.id]) priced++;
    if(owned[c.id]){ n++; if(p) vOwned += p * qty(c.id); } else if(p) vMissing += p;
  }
  return {n, total:cards.length, vOwned, vMissing, priced};
}

function renderSet(){
  const s = current, st = setStats();
  const pct = st.total ? st.n / st.total * 100 : 0;
  const date = s.releaseDate ? new Date(s.releaseDate).toLocaleDateString("fr-FR",{year:"numeric",month:"long",day:"numeric"}) : "";
  $("#main").innerHTML = `
    <section class="sethead">
      ${s.logo ? `<img class="logo" src="${esc(s.logo)}.webp" alt="${esc(s.name)}" onerror="this.remove()">` : ""}
      <div style="min-width:0">
        <h1>${esc(s.name)}</h1>
        <div class="sub">${esc(s.serie?.name || "")}${date ? " · sortie le " + esc(date) : ""} · ${esc(s.cardCount?.official ?? st.total)} cartes officielles${s.cardCount?.total > s.cardCount?.official ? " + " + (s.cardCount.total - s.cardCount.official) + (s.cardCount.total - s.cardCount.official > 1 ? " secrètes" : " secrète") : ""}</div>
      </div>
      <div class="kpis">
        <div class="kpi"><b id="kOwned">${st.n}/${st.total}</b><span>possédées</span></div>
        <div class="kpi"><b id="kVal">${fmtEur(st.vOwned)}</b><span>valeur de mes cartes</span></div>
        <div class="kpi"><b id="kMiss">${fmtEur(st.vMissing)}</b><span>coût des manquantes</span></div>
      </div>
      <div class="bigbar"><i id="kBar" style="width:${pct}%"></i></div>
    </section>
    <div class="filters">
      <div class="seg" role="group" aria-label="Filtrer">
        <button type="button" data-f="all" aria-pressed="${filter==="all"}">Toutes</button>
        <button type="button" data-f="owned" aria-pressed="${filter==="owned"}">Je l'ai</button>
        <button type="button" data-f="missing" aria-pressed="${filter==="missing"}">Il me manque</button>
        <button type="button" data-f="trade" aria-pressed="${filter==="trade"}">À échanger</button>
      </div>
      <input type="search" id="q" placeholder="Nom ou numéro…" value="${esc(query)}" aria-label="Chercher une carte">
      <select class="btn" id="sort" aria-label="Trier">
        <option value="num"${sortBy==="num"?" selected":""}>Tri : numéro</option>
        <option value="price"${sortBy==="price"?" selected":""}>Tri : prix décroissant</option>
        <option value="name"${sortBy==="name"?" selected":""}>Tri : nom</option>
      </select>
      <button class="btn primary" id="loadPrices">${st.priced >= st.total ? "Actualiser les prix" : "Charger les prix du set"}</button>
      <button class="btn" id="checkAll">Tout cocher</button>
      <span class="progress-note" id="pnote">${st.priced}/${st.total} prix chargés</span>
    </div>
    <div class="grid" id="grid"></div>`;
  renderGrid();
}

function visibleCards(){
  const q = query.trim().toLowerCase();
  let list = current.cards.filter(c => {
    if(filter === "owned" && !owned[c.id]) return false;
    if(filter === "missing" && owned[c.id]) return false;
    if(filter === "trade" && !tradeN(c.id)) return false;
    if(q && !(c.name.toLowerCase().includes(q) || String(c.localId).toLowerCase() === q || String(c.localId).toLowerCase().includes(q))) return false;
    return true;
  });
  const numKey = c => { const n = parseInt(c.localId, 10); return isNaN(n) ? 1e6 : n; };
  if(sortBy === "num") list.sort((a,b) => numKey(a) - numKey(b) || String(a.localId).localeCompare(String(b.localId)));
  if(sortBy === "name") list.sort((a,b) => a.name.localeCompare(b.name, "fr"));
  if(sortBy === "price") list.sort((a,b) => (refPrice(b.id) ?? -1) - (refPrice(a.id) ?? -1));
  return list;
}

function priceHTML(id){
  const p = refPrice(id);
  if(p != null){
    const mine = typeof custom[id] === "number";
    return `<span class="price${p >= 20 ? " hot" : ""}" title="${mine ? "Mon prix" : MODE_LABEL[priceMode]}">${fmtEur(p)}${mine ? " ✎" : ""}</span>`;
  }
  if(prices[id]) return `<span class="price none">pas de prix</span>`;
  return `<span class="price none"><button type="button" data-price="${esc(id)}">voir le prix</button></span>`;
}

function tagsHTML(id){
  if(!owned[id]) return "";
  const q = qty(id), t = tradeN(id), cd = items[id]?.c;
  const tags = [];
  if(q > 1) tags.push(`<span class="tag" title="${q} exemplaires">×${q}</span>`);
  if(cd) tags.push(`<span class="tag" title="${esc(CONDS_SHORT[cd])}">${esc(cd)}</span>`);
  if(t) tags.push(`<span class="tag trade" title="${t} à échanger">⇄ ${t}</span>`);
  return tags.length ? `<span class="tags">${tags.join("")}</span>` : "";
}
// Image de vignette : petite version sur écran standard, version HD sur écran haute densité (téléphone, Retina)
function thumbHTML(base, alt){
  if(!base) return "";
  const b = esc(base);
  return `<img src="${b}/low.webp" srcset="${b}/low.webp 245w, ${b}/high.webp 600w" sizes="(max-width:860px) 46vw, 200px" alt="${esc(alt)}" loading="lazy" decoding="async" onerror="imgFail(this)">`;
}
// Image introuvable : on essaie la version anglaise, sinon on laisse place à la carte de remplacement
function imgFail(el){
  if(lang !== "en" && !el.dataset.f && el.src.includes(`/${lang}/`)){
    el.dataset.f = 1;
    if(el.srcset) el.srcset = el.srcset.split(`/${lang}/`).join("/en/");
    el.src = el.src.replace(`/${lang}/`, "/en/");
  } else el.remove();
}
function placeholderHTML(name, num){
  return `<span class="noimg" aria-hidden="true"><span class="ph-ball"></span><span class="ph-name">${esc(name)}</span>${num ? `<span class="ph-num">n° ${esc(num)}</span>` : ""}<span class="ph-note">image pas encore disponible</span></span>`;
}
function cardHTML(c){
  const total = current.cardCount?.official || current.cards.length;
  return `<article class="card${owned[c.id] ? " owned" : ""}" data-id="${esc(c.id)}">
    <button type="button" class="pic" data-open="${esc(c.id)}" aria-label="Voir ${esc(c.name)} en grand">
      ${placeholderHTML(c.name, c.localId)}${thumbHTML(c.image, c.name)}<span class="glare"></span><span class="sheen"></span>${c.en ? `<span class="lang-badge" title="Carte absente de la base française : nom et image en anglais">EN</span>` : ""}<span class="badge-owned">✓</span>${tagsHTML(c.id)}
    </button>
    <div class="cinfo"><span class="cname" title="${esc(c.name)}">${esc(c.name)}</span><span class="cnum">${esc(c.localId)}/${esc(total)}</span></div>
    <div class="crow">
      <span class="pslot">${priceHTML(c.id)}</span>
      <label class="own"><input type="checkbox" data-own="${esc(c.id)}"${owned[c.id] ? " checked" : ""}>Je l'ai</label>
    </div>

function renderGrid(){

function refreshKpis(){
  if(!current) return;
  const st = setStats();
  $("#kOwned").textContent = `${st.n}/${st.total}`;
  $("#kVal").textContent = fmtEur(st.vOwned);
  $("#kMiss").textContent = fmtEur(st.vMissing);

  $("#pnote").textContent = `${st.priced}/${st.total} prix chargés`;

// Redessine une carte de la grille après un changement
function refreshCardEl(id){
  if(view === "trades"){ renderTrades(); return; }
  const el = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if(!el || !current) return;
  const c = current.cards.find(x => x.id === id); if(!c) return;
  const hide = (filter === "owned" && !owned[id]) || (filter === "missing" && owned[id]) || (filter === "trade" && !tradeN(id));
  if(hide){ el.remove(); return; }
  const tmp = document.createElement("div"); tmp.innerHTML = cardHTML(c);
  el.replaceWith(tmp.firstElementChild);
}
function refreshCardPrice(id){
  const el = document.querySelector(`.card[data-id="${CSS.escape(id)}"] .pslot`);
  if(el) el.innerHTML = priceHTML(id);
}

function setOwned(id, val){
  if(val){ owned[id] = true; const c = current?.cards.find(x => x.id === id); if(c) ownedMeta[id] = metaFrom(c, current); }
  else { delete owned[id]; delete ownedMeta[id]; delete items[id]; LS.set("pk.items", items); }
  LS.set("pk.owned", owned); LS.set("pk.ownedMeta", ownedMeta);
  refreshCardEl(id);
  if(val){
    const el = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
    if(el){ el.classList.add("just-owned"); setTimeout(() => el.classList.remove("just-owned"), 1000); }
  }
  refreshKpis(); updateGlobal(); renderSide();
}

$("#main").addEventListener("click", async e => {
  const f = e.target.closest("[data-f]");
  if(f){ filter = f.dataset.f; document.querySelectorAll("[data-f]").forEach(b => b.setAttribute("aria-pressed", b === f)); renderGrid(); return; }
  const pb = e.target.closest("[data-price]");
  if(pb){
    const id = pb.dataset.price; pb.textContent = "…";
    try{ await fetchPrice(id); }catch(err){ toast("Prix indisponible pour le moment"); }
    refreshCardPrice(id); refreshKpis(); updateGlobal(); return;
  }

  if(e.target.id === "checkAll"){
    const list = visibleCards(); const allOwned = list.every(c => owned[c.id]);
    if(!allOwned && !e.target.dataset.confirm){
      e.target.dataset.confirm = 1; e.target.textContent = `Confirmer (${list.length} cartes)`;
      setTimeout(() => { if(e.target.isConnected){ delete e.target.dataset.confirm; e.target.textContent = "Tout cocher"; } }, 3500);
      return;
    }
    list.forEach(c => { if(allOwned){ delete owned[c.id]; delete ownedMeta[c.id]; delete items[c.id]; } else if(!owned[c.id]){ owned[c.id] = true; ownedMeta[c.id] = metaFrom(c, current); } });
    LS.set("pk.owned", owned); LS.set("pk.ownedMeta", ownedMeta); LS.set("pk.items", items);
    renderSet(); updateGlobal(); renderSide();

async function loadAllPrices(btn){
  const set = current, ids = set.cards.map(c => c.id);
  const force = btn.textContent.startsWith("Actualiser");
  btn.disabled = true;
  const {fail} = await priceQueue(ids, force, (id, done) => {
    if(current !== set) return;
    refreshCardPrice(id);
    if(btn.isConnected) btn.textContent = `Prix… ${done}/${ids.length}`;
    if(done % 10 === 0){ refreshKpis(); updateGlobal(); }
  });
  if(current === set){
    refreshKpis(); updateGlobal();
    if(sortBy === "price") renderGrid();
    if(btn.isConnected){ btn.disabled = false; btn.textContent = "Actualiser les prix"; }
    toast(fail ? `${ids.length - fail} prix chargés, ${fail} indisponibles` : "Prix à jour");
  }
}

  const total = ids.reduce((a, id) => a + tradeN(id), 0);

let globalBusy = false;
async function calcGlobal(){
  const ids = Object.keys(owned).filter(id => !priceFresh(id));
  if(!ids.length || globalBusy) return;

}

/* ================= Effet 3D & holographie des cartes ================= */
const FINE = matchMedia("(hover:hover) and (pointer:fine)").matches;
const REDUCED = matchMedia("(prefers-reduced-motion:reduce)").matches;
function tiltMove(el, clientX, clientY, max){
  const r = el.getBoundingClientRect();
  if(!r.width) return;
  const px = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
  const py = Math.min(1, Math.max(0, (clientY - r.top) / r.height));
  el.style.setProperty("--rx", ((0.5 - py) * 2 * max).toFixed(2) + "deg");
  el.style.setProperty("--ry", ((px - 0.5) * 2 * max).toFixed(2) + "deg");
  el.style.setProperty("--mx", (px * 100).toFixed(1) + "%");
  el.style.setProperty("--my", (py * 100).toFixed(1) + "%");
  el.style.setProperty("--sc", "1.04");
  el.style.setProperty("--holo", "1");
  el.classList.add("tilting");
}
function tiltReset(el){
  if(!el) return;
  el.style.setProperty("--rx", "0deg"); el.style.setProperty("--ry", "0deg");
  el.style.setProperty("--sc", "1"); el.style.setProperty("--holo", "0");
  el.classList.remove("tilting");
}
if(FINE && !REDUCED){
  const main = $("#main"); let hovered = null, rafG = 0, gx = 0, gy = 0;
  main.addEventListener("pointermove", e => {
    const pic = e.target.closest(".pic");
    if(pic !== hovered){ tiltReset(hovered); hovered = pic; }
    if(!pic) return;
    gx = e.clientX; gy = e.clientY;
    if(!rafG) rafG = requestAnimationFrame(() => { rafG = 0; if(hovered) tiltMove(hovered, gx, gy, 9); });
  });
  main.addEventListener("pointerleave", () => { tiltReset(hovered); hovered = null; });
}
